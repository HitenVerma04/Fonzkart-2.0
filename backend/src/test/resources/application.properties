# Test-only settings (on top of src/main/resources/application.yml).
# The startup run of catalog/launch-prices.json would add models to every test database; LaunchPriceImportTest runs
# the import itself.
fonzkart.catalog.launch-prices=false

# The nightly revaluation and learning run would change prices mid-test; tests call them directly.
fonzkart.pricing.jobs=false
